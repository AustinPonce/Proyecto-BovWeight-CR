name: Deploy ML Service to Azure

on:
  push:
    branches: [main]
    paths:
      - 'ml_service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy ML Service to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bovweight-ml'
          publish-profile: ${{ secrets.AZURE_ML_WEBAPP_PUBLISH_PROFILE }}
          package: ./ml_service
